{% extends "base.html" %}
{% block content %}

<div class="hero mb-4">
  <h2 class="mb-1">Find your next stay</h2>
  <p class="mb-0">Login, search rooms, and book.</p>
</div>

<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0">Hotels</h4>
  <a class="btn btn-primary btn-sm" href="{{ url_for('search') }}">Search rooms</a>
</div>

<div class="row g-3">
  {% for h in hotels %}
  <div class="col-12 col-md-6 col-lg-4">
    <div class="card card-soft shadow-sm h-100 lift">
      <div class="card-body">
        <h5 class="card-title mb-1">{{h[1]}}</h5>
        <div class="text-secondary small">{{h[2]}}{% if h[3] %}, {{h[3]}}{% endif %} · {{h[4]}}</div>
        <div class="mt-3 d-flex gap-2">
          <a class="btn btn-outline-primary btn-sm" href="{{ url_for('hotel_page', hotel_id=h[0]) }}">View rooms</a>
          <a class="btn btn-primary btn-sm" href="{{ url_for('search', city=h[2]) }}">Search city</a>
        </div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>

{% endblock %}
